name: queue-probe
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  queue-probe:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "merge_group_head_sha=${{ github.event.merge_group.head_sha }}"

      - name: pick an event-specific key prefix
        id: k
        run: |
          case "${{ github.event_name }}" in
            pull_request) P=pr ;;
            merge_group)  P=mg ;;
            *)            P=main ;;
          esac
          echo "prefix=$P" >> "$GITHUB_OUTPUT"

      - name: build a marker payload
        run: |
          mkdir -p payload
          printf 'event=%s ref=%s run=%s\n' "${{ github.event_name }}" "${{ github.ref }}" "${{ github.run_id }}" > payload/marker.txt

      - name: SAVE (does this run get a write-capable cache token?)
        id: save
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-${{ steps.k.outputs.prefix }}-${{ github.run_id }}

      # Every restore below uses the SAME path as the save step on purpose: actions/cache derives
      # the lookup "version" from the paths (+compression), so a different path can never match a
      # saved entry. The first iteration of this probe used distinct paths per step and every
      # lookup missed, including the same-scope control - so no scope conclusion was drawn from it.
      - name: "CONTROL (push): same-scope restore from refs/heads/main must HIT"
        if: github.event_name == 'push'
        id: pos_main
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-main-${{ github.run_id }}
          restore-keys: |
            qp-main-

      - name: "CROSSING: can a default-branch run read a pull_request cache entry?"
        if: github.event_name == 'push'
        id: r_prread
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-pr-${{ github.run_id }}
          restore-keys: |
            qp-pr-

      - name: "RESTORE: can a default-branch run read the merge-queue scope?"
        if: github.event_name == 'push'
        id: r_mg
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-mg-${{ github.run_id }}
          restore-keys: |
            qp-mg-

      - name: "CONTROL (pull_request): same-ref restore from refs/pull/N/merge must HIT"
        if: github.event_name == 'pull_request'
        id: pos_pr
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-pr-${{ github.run_id }}
          restore-keys: |
            qp-pr-

      - name: "RESTORE: can a pull_request run read the default-branch scope?"
        if: github.event_name == 'pull_request'
        id: r_pr
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-main-${{ github.run_id }}
          restore-keys: |
            qp-main-

      - name: "RESTORE: can a merge_group run read the default-branch scope?"
        if: github.event_name == 'merge_group'
        id: r_main
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: payload
          key: qp-main-${{ github.run_id }}
          restore-keys: |
            qp-main-

      - name: results
        if: always()
        run: |
          echo "save.outcome=${{ steps.save.outcome }}"
          echo "CONTROL-push-reads-main=${{ steps.pos_main.outputs.cache-matched-key }}"
          echo "CROSSING-push-reads-pr=${{ steps.r_prread.outputs.cache-matched-key }}"
          echo "push-reads-mg=${{ steps.r_mg.outputs.cache-matched-key }}"
          echo "CONTROL-pr-reads-pr=${{ steps.pos_pr.outputs.cache-matched-key }}"
          echo "pr-reads-main=${{ steps.r_pr.outputs.cache-matched-key }}"
          echo "mg-reads-main=${{ steps.r_main.outputs.cache-matched-key }}"
          echo "--- payload/marker.txt (reflects the last restore that hit) ---"
          cat payload/marker.txt || true
